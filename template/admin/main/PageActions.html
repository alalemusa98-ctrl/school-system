<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إجراءات وتاريخ الصفحة - PageActions</title>
  
  <!-- Apple SF Arabic WebFont CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mrbubbles/sf-arabic-font@master/SF-Arabic.css">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display">

  <style>
    /* Global Reset & Typography */
    *, body, html {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SF Arabic', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      direction: rtl;
    }

    /* ===== PAGE ACTIONS COMPONENT CONTAINER ===== */
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 1. DATE DISPLAY PILL */
    .saas-date-pill {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
      user-select: none;
    }

    .saas-date-pill .pill-icon {
      color: #64748b;
      flex-shrink: 0;
    }

    /* 2. PRINT REPORT ACTION BUTTON */
    .saas-print-btn {
      background: #ffffff;
      border: 1px solid #c7d2fe;
      color: #4f46e5;
      border-radius: 14px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      outline: none;
    }

    .saas-print-btn .btn-icon {
      color: #4f46e5;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .saas-print-btn:hover {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
      transform: translateY(-1px);
    }

    .saas-print-btn:hover .btn-icon {
      color: #ffffff;
      transform: scale(1.08);
    }

    .saas-print-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.15);
    }
  </style>
</head>
<body>

  <!-- PageActions Component -->
  <div class="page-header-actions">
    
    <!-- 1. Date Display Pill -->
    <div class="saas-date-pill">
      <svg class="pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>اليوم: الجمعة، 16 أغسطس 2026</span>
    </div>

    <!-- 2. Print Report Button -->
    <button class="saas-print-btn" onclick="window.print()">
      <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      <span>طباعة التقرير اليومي</span>
    </button>

  </div>

</body>
</html>
